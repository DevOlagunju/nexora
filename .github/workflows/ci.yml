name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway values so build + tests run; never real secrets.
      DATABASE_URL: postgresql://nexora:nexora@localhost:5432/nexora
      AUTH_SECRET: ci-only-auth-secret-not-for-production-use
      ENCRYPTION_KEY: 1111111111111111111111111111111111111111111111111111111111111111
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      # The database tests clone a migrated template on this server (tests/setup).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations apply cleanly
        run: npx prisma migrate deploy
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
