# Local Postgres for development:      docker compose up -d postgres
# Full production-like stack:           docker compose --profile app up -d --build
#   (requires .env.production - see docs/POSTGRES.md)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Set POSTGRES_PORT in .env when 5432 is already taken on this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    volumes:
      - nexora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrate
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    profiles: ["app"]
    build:
      context: .
      target: runner
    env_file: .env.production
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  nexora_pg:
